baseURL = 'https://anand-raj.github.io/cms-hugo-sveltia/'
languageCode = 'en-us'
title = 'My New Hugo Project'

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "A production-ready Hugo site built with best practices."
  # Set this to your membership worker URL after deploying it to Cloudflare
  membershipWorkerUrl = "https://cms-membership.e-anandraj.workers.dev"
  # Set after deploying cloudflare-books-worker
  booksWorkerUrl      = "https://cms-books.e-anandraj.workers.dev"
  # Razorpay publishable key (safe to be public) — use rzp_test_xxx for testing
  razorpayKeyId       = "REPLACE_WITH_RAZORPAY_KEY_ID"

  [params.social]
    twitter = "yourtwitterhandle"
    github  = "anand-raj"

[[menus.main]]
  name   = "Articles"
  url    = "/articles/"
  weight = 10

[[menus.main]]
  name   = "News"
  url    = "/news/"
  weight = 30

[[menus.main]]
  name   = "Events"
  url    = "/events/"
  weight = 40
