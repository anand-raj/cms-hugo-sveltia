{{ define "main" }}
{{ $workerUrl := site.Params.booksWorkerUrl }}
<div class="content-wrap">
  <h1 class="section-label">Books</h1>
  {{ with .Description }}<p class="books-intro">{{ . }}</p>{{ end }}

  <div class="books-grid" id="books-grid">
    <p id="books-loading" class="books-loading">Loading books…</p>
  </div>
</div>

<script>
(function () {
  const WORKER   = '{{ $workerUrl | safeJS }}';
  const BASE_URL = '{{ site.Home.RelPermalink | safeJS }}';
  const grid     = document.getElementById('books-grid');

  fetch(WORKER + '/books')
    .then(function (r) { return r.json(); })
    .then(function (books) {
      if (!books.length) {
        grid.innerHTML = '<p class="books-empty">No books available yet.</p>';
        return;
      }
      grid.innerHTML = books.map(function (b) {
        const bookUrl  = BASE_URL + 'books/' + b.slug + '/';
        const priceINR = '₹' + (b.price_paise / 100).toLocaleString('en-IN');
        const stockBadge = b.in_stock
          ? '<span class="book-stock book-stock--in">In Stock</span>'
          : '<span class="book-stock book-stock--out">Out of Stock</span>';
        const buyBtn = b.in_stock
          ? '<a class="btn-buy btn-buy--small" href="' + bookUrl + '">Buy</a>'
          : '';
        const coverHtml = b.image_url
          ? '<a class="book-card-cover-link" href="' + bookUrl + '" tabindex="-1" aria-hidden="true">' +
              '<img src="' + b.image_url + '" alt="' + b.title + ' cover" loading="lazy">' +
            '</a>'
          : '<a class="book-card-cover-link book-card-cover-link--empty" href="' + bookUrl + '" tabindex="-1" aria-hidden="true">' +
              '<span class="book-card-cover-placeholder">📖</span>' +
            '</a>';
        const authorHtml = b.author
          ? '<p class="book-card-author">' + b.author + '</p>'
          : '';
        const descHtml = b.description
          ? '<p class="book-card-desc">' + b.description.slice(0, 120) + (b.description.length > 120 ? '…' : '') + '</p>'
          : '';
        return '<article class="book-card">' +
          coverHtml +
          '<div class="book-card-body">' +
            '<h2 class="book-card-title"><a href="' + bookUrl + '">' + b.title + '</a></h2>' +
            authorHtml +
            descHtml +
            '<div class="book-card-footer">' +
              '<span class="book-card-price">' + priceINR + '</span>' +
              stockBadge +
              buyBtn +
            '</div>' +
          '</div>' +
        '</article>';
      }).join('');
    })
    .catch(function () {
      grid.innerHTML = '<p class="books-empty">Could not load books. Please try again later.</p>';
    });
})();
</script>
{{ end }}
