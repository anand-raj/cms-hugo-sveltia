{{ $workerUrl := site.Params.membershipWorkerUrl }}
<section class="membership-form-section">
  <form id="membership-form" class="membership-form" novalidate>

    <div class="form-group">
      <label for="mem-name">Full name <span class="req">*</span></label>
      <input id="mem-name" name="name" type="text" required
             autocomplete="name" placeholder="Jane Smith">
    </div>

    <div class="form-group">
      <label for="mem-email">Email address <span class="req">*</span></label>
      <input id="mem-email" name="email" type="email" required
             autocomplete="email" placeholder="jane@example.com">
    </div>

    <div class="form-group">
      <label for="mem-occupation">Occupation</label>
      <input id="mem-occupation" name="occupation" type="text"
             autocomplete="organization-title" placeholder="Software Engineer">
    </div>

    <div class="form-group">
      <label for="mem-phone">Phone number</label>
      <input id="mem-phone" name="phone" type="tel"
             autocomplete="tel" placeholder="+91 98765 43210">
    </div>

    <div class="form-group">
      <label for="mem-pincode">Pincode <span class="req">*</span></label>
      <input id="mem-pincode" name="pincode" type="text" required
             inputmode="numeric" maxlength="6" placeholder="560001">
      <span class="pincode-status" aria-live="polite"></span>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="mem-city">City <span class="req">*</span></label>
        <input id="mem-city" name="city" type="text" required
               autocomplete="address-level2" placeholder="Bengaluru">
      </div>
      <div class="form-group">
        <label for="mem-state">State</label>
        <input id="mem-state" name="state" type="text" readonly
               placeholder="Auto-filled from pincode">
      </div>
    </div>

    {{/* Honeypot — invisible to humans, bots fill it in */}}
    <input name="website" type="text" tabindex="-1" autocomplete="off"
           style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">

    <button type="submit" class="btn-membership-submit">Request Membership</button>

    <p class="form-status" role="status" aria-live="polite"></p>
  </form>
</section>

<script>
(function () {
  const form    = document.getElementById('membership-form');
  const status  = form.querySelector('.form-status');
  const btn     = form.querySelector('.btn-membership-submit');
  const pinEl   = form.querySelector('[name="pincode"]');
  const cityEl  = form.querySelector('[name="city"]');
  const stateEl = form.querySelector('[name="state"]');
  const pinStatus = form.querySelector('.pincode-status');

  // ── Pincode auto-fill via India Post API ─────────────────────
  let pincodeTimer;
  pinEl.addEventListener('input', function () {
    clearTimeout(pincodeTimer);
    const pin = this.value.replace(/\D/g, '');
    if (pin.length !== 6) {
      stateEl.value = '';
      pinStatus.textContent = '';
      return;
    }
    pinStatus.textContent = 'Looking up…';
    pinStatus.style.color = '';
    pincodeTimer = setTimeout(function () { lookupPincode(pin); }, 400);
  });

  async function lookupPincode(pin) {
    try {
      const res  = await fetch('https://api.postalpincode.in/pincode/' + pin);
      const data = await res.json();
      if (data[0] && data[0].Status === 'Success' && data[0].PostOffice && data[0].PostOffice.length) {
        const po = data[0].PostOffice[0];
        cityEl.value  = po.District || po.Name || '';
        stateEl.value = po.State || '';
        pinStatus.textContent = '✓ ' + po.District + ', ' + po.State;
        pinStatus.style.color = '#16a34a';
      } else {
        stateEl.value = '';
        pinStatus.textContent = 'Pincode not found';
        pinStatus.style.color = '#dc2626';
      }
    } catch {
      stateEl.value = '';
      pinStatus.textContent = 'Could not look up pincode';
      pinStatus.style.color = '#b45309';
    }
  }

  // ── Form submit ──────────────────────────────────────────────
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    btn.disabled    = true;
    btn.textContent = 'Sending…';
    status.textContent = '';
    status.className   = 'form-status';

    const payload = {
      name:       form.querySelector('[name="name"]').value.trim(),
      email:      form.querySelector('[name="email"]').value.trim(),
      occupation: form.querySelector('[name="occupation"]').value.trim(),
      phone:      form.querySelector('[name="phone"]').value.trim(),
      pincode:    form.querySelector('[name="pincode"]').value.trim(),
      city:       cityEl.value.trim(),
      state:      stateEl.value.trim(),
      website:    form.querySelector('[name="website"]').value,
    };

    try {
      const res  = await fetch('{{ $workerUrl }}/subscribe', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload),
      });
      const data = await res.json();

      if (res.ok && data.ok) {
        form.querySelectorAll('.form-group, .form-row').forEach(function(g) { g.style.display = 'none'; });
        btn.style.display  = 'none';
        status.textContent = 'Request received! We will review it and get back to you shortly.';
        status.classList.add('form-status--success');
      } else {
        status.textContent = data.error || 'Something went wrong. Please try again.';
        status.classList.add('form-status--error');
        btn.disabled    = false;
        btn.textContent = 'Request Membership';
      }
    } catch {
      status.textContent = 'Network error. Please check your connection and try again.';
      status.classList.add('form-status--error');
      btn.disabled    = false;
      btn.textContent = 'Request Membership';
    }
  });
})();
</script>
